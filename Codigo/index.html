<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cositas" />
  <meta name="application-name" content="VentaCositas" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="Inventario offline de artículos a vender" />
  <script>
    // Aplica el tema guardado ANTES de pintar para evitar flash de tema (misma regla que resolverTema).
    (function () {
      try {
        var pref = localStorage.getItem('ventacositas.tema');
        var oscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var tema = pref === 'claro' ? 'claro' : (pref === 'oscuro' ? 'oscuro' : (oscuro ? 'oscuro' : 'claro'));
        document.documentElement.setAttribute('data-tema', tema);
      } catch (e) {
        /* sin storage/matchMedia: se usa el default del CSS */
      }
    })();
  </script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>VentaCositas</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Registro del service worker (offline-first).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => {
          console.warn('Service worker no registrado:', e);
        });
      });
    }
  </script>
</body>
</html>
